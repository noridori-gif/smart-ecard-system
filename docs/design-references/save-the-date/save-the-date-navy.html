<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<title>Save the Date – toleo la navy</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<div style="position: relative; width: 900px; height: 1280px; overflow: hidden; border-radius: 28px; background-color: #0c1f3d; background-image: repeating-linear-gradient(135deg, rgba(239,230,214,0.04) 0px, rgba(239,230,214,0.04) 1px, transparent 1px, transparent 7px); font-family: 'Lato', 'Helvetica Neue', sans-serif; color: #efe6d6">

  <!-- double border (same as the invitation) -->
  <div style="position: absolute; left: 16px; top: 16px; right: 16px; bottom: 16px; border: 1.5px solid #d97b4f; border-radius: 18px"></div>
  <div style="position: absolute; left: 24px; top: 24px; right: 24px; bottom: 24px; border: 1px solid #1d4a68; border-radius: 14px"></div>

  <!-- header -->
  <div style="position: absolute; left: 0; top: 52px; width: 900px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <svg width="200" height="72" viewBox="0 0 240 90" fill="none" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
      <path d="M20 74 C60 66 90 58 120 48 C150 58 180 66 220 74" stroke="#5f8aa6"></path>
      <path d="M42 70 C36 58 42 48 54 46 C56 58 52 66 42 70Z" stroke="#5f8aa6" fill="rgba(95,138,166,0.25)"></path>
      <path d="M198 70 C204 58 198 48 186 46 C184 58 188 66 198 70Z" stroke="#5f8aa6" fill="rgba(95,138,166,0.25)"></path>
      <g transform="translate(120 40)" stroke="#d65a12" fill="rgba(214,90,18,0.35)"><ellipse cx="0" cy="-15" rx="9" ry="15"></ellipse><ellipse cx="0" cy="-15" rx="9" ry="15" transform="rotate(72)"></ellipse><ellipse cx="0" cy="-15" rx="9" ry="15" transform="rotate(144)"></ellipse><ellipse cx="0" cy="-15" rx="9" ry="15" transform="rotate(216)"></ellipse><ellipse cx="0" cy="-15" rx="9" ry="15" transform="rotate(288)"></ellipse><circle cx="0" cy="0" r="4" fill="#efe6d6" stroke="none"></circle></g>
      <g transform="translate(86 56) scale(0.6)" stroke="#d97b4f" fill="rgba(217,123,79,0.3)"><ellipse cx="0" cy="-14" rx="8" ry="14"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(72)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(144)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(216)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(288)"></ellipse></g>
      <g transform="translate(156 56) scale(0.6)" stroke="#efe6d6" fill="rgba(239,230,214,0.2)"><ellipse cx="0" cy="-14" rx="8" ry="14"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(72)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(144)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(216)"></ellipse><ellipse cx="0" cy="-14" rx="8" ry="14" transform="rotate(288)"></ellipse></g>
    </svg>
    <p style="margin: 2px 0 0 0; font-family: 'Kaushan Script', 'Brush Script MT', cursive; font-size: 78px; line-height: 1.05; color: #efe6d6">Save the Date</p>
    <p style="margin: 14px 0 0 0; font-size: 25px; line-height: 1.45">Mpendwa <span style="font-size: 34px; font-weight: 900; color: #e08a5c">Mr &amp; Mrs Mgeni</span>,<br>tafadhali hifadhi tarehe hii kwa ajili ya harusi yetu</p>
  </div>

  <!-- photo: pinned print -->
  <div style="position: absolute; left: 242px; top: 346px; width: 416px; box-sizing: border-box; padding: 18px; background: #fffdf8; border-radius: 4px; transform: rotate(-2deg); box-shadow: 0 14px 30px rgba(0,0,0,0.45)">
    <img src="couple.png" alt="Frida na Dr. Elia" style="display: block; width: 380px; height: 496px; object-fit: cover; object-position: center top">
    <div style="position: absolute; left: -26px; top: 6px; width: 120px; height: 30px; background: rgba(217,123,79,0.75); transform: rotate(-38deg)"></div>
    <div style="position: absolute; right: -26px; top: 6px; width: 120px; height: 30px; background: rgba(217,123,79,0.75); transform: rotate(38deg)"></div>
  </div>

  <!-- floral sprigs beside the photo -->
  <svg width="140" height="140" viewBox="0 0 140 140" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 118px; top: 744px">
    <g transform="translate(110 30)">
      <path d="M-90 90 C-60 60 -30 30 0 0" stroke="#5f8aa6"></path>
      <path d="M-46 52 C-56 36 -50 24 -34 22 C-32 38 -36 46 -46 52Z" stroke="#5f8aa6" fill="rgba(95,138,166,0.25)"></path>
      <path d="M-70 76 C-84 66 -82 52 -66 48 C-62 62 -62 70 -70 76Z" stroke="#5f8aa6" fill="rgba(95,138,166,0.25)"></path>
      <g stroke="#d65a12" fill="rgba(214,90,18,0.35)"><ellipse cx="0" cy="-17" rx="10" ry="17"></ellipse><ellipse cx="0" cy="-17" rx="10" ry="17" transform="rotate(72)"></ellipse><ellipse cx="0" cy="-17" rx="10" ry="17" transform="rotate(144)"></ellipse><ellipse cx="0" cy="-17" rx="10" ry="17" transform="rotate(216)"></ellipse><ellipse cx="0" cy="-17" rx="10" ry="17" transform="rotate(288)"></ellipse><circle cx="0" cy="0" r="4.5" fill="#efe6d6" stroke="none"></circle></g>
    </g>
  </svg>

  <!-- names, date, place -->
  <div style="position: absolute; left: 0; top: 912px; width: 900px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px">
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 18px; font-family: 'Kaushan Script', 'Brush Script MT', cursive; line-height: 1.1">
      <span style="font-size: 64px">Frida</span>
      <span style="font-size: 52px; color: #d65a12">&amp;</span>
      <span style="font-size: 64px">Dr. Elia</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-size: 21px; font-weight: 700; padding: 7px 0; border-top: 1.5px solid #d97b4f; border-bottom: 1.5px solid #d97b4f; width: 124px">Jumamosi</span>
      <span style="font-size: 60px; font-weight: 900; line-height: 1; color: #d65a12">17</span>
      <span style="font-size: 21px; font-weight: 700; padding: 7px 0; border-top: 1.5px solid #d97b4f; border-bottom: 1.5px solid #d97b4f; width: 124px">Okt 2026</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="20" height="26" viewBox="0 0 20 26" aria-hidden="true"><path d="M10 1 C4.5 1 1 5 1 9.6 C1 16 10 25 10 25 C10 25 19 16 19 9.6 C19 5 15.5 1 10 1Z" fill="none" stroke="#d65a12" stroke-width="1.8"></path><circle cx="10" cy="9.6" r="3" fill="#d65a12"></circle></svg>
      <span style="font-size: 24px; font-weight: 900; color: #e08a5c">Mirado Hall</span>
    </div>
    <p style="margin: 6px 0 0 0; font-family: 'Kaushan Script', 'Brush Script MT', cursive; font-size: 24px; color: #efe6d6">Mwaliko rasmi utafuata</p>
  </div>

</div>
</body>
</html>
